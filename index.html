<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Velocity KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d1b;--pn:rgba(255,255,255,.035);--ln:rgba(255,255,255,.08);--tx:#e9e9f6;--mut:#8b8ba8;--mint:#2ee6c0;--yel:#f5c342;--org:#f2792b;--mag:#ff2e8b;--pur:#7b3fe0;
--rj:'Rajdhani','Barlow Condensed','Arial Narrow',sans-serif;--sn:'Inter','Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--sn);color:var(--tx)}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse 70% 80% at 50% 40%,#1b1b36 0%,#12122a 55%,#0d0d1b 100%)}
#stage>*{position:absolute}
#bgimg{inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;pointer-events:none}
#grid{inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.pnl{background:rgba(255,255,255,.03);border:1px solid var(--ln);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.cd{position:absolute;pointer-events:auto;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.cd .h{height:32px;padding:0 14px;display:flex;align-items:center;gap:7px;font:700 9.6px var(--sn);letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.cd .h i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--mint));box-shadow:0 0 8px var(--c,var(--mint));flex:none}
.cd .h b{margin-left:auto;font:600 8.6px var(--sn);letter-spacing:.4px;color:var(--c,var(--mint));text-transform:none}
.cd .bd{position:absolute;left:0;right:0;top:32px;bottom:0}
/* header */
#brand{left:26px;top:12px;width:330px;height:52px;display:flex;align-items:center;gap:11px}
#brand .bl{width:46px;height:46px;border-radius:14px;background:conic-gradient(from 210deg,#2ee6c0,#f5c342,#ff2e8b,#2ee6c0);display:grid;place-items:center;box-shadow:0 0 18px rgba(46,230,192,.4);flex:none}
#brand .bl i{width:36px;height:36px;border-radius:11px;background:#10102a;display:grid;place-items:center;font:700 19px var(--rj);color:#fff;font-style:normal}
#brand b{display:block;font:700 33px/.95 var(--rj);letter-spacing:4px;color:#fff;text-shadow:0 0 16px rgba(46,230,192,.45)}
#brand b i{font-style:normal;color:var(--mint)}
#brand span{display:block;font:700 8.6px var(--sn);letter-spacing:1.8px;color:var(--mut);text-transform:uppercase;margin-top:2px}
#brand em{display:block;font:500 6.6px var(--sn);font-style:normal;color:#6e6e8c;margin-top:1px;white-space:nowrap}
#lks{left:372px;top:19px;display:flex;gap:6px}
#lks a{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 6px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font:700 10.4px var(--sn);color:#fff;text-decoration:none;white-space:nowrap}
#lks a svg{width:19px;height:19px;flex:none}#lks a:hover{border-color:var(--mint);box-shadow:0 0 12px rgba(46,230,192,.3)}
#tools{left:690px;top:21px;display:flex;gap:6px;align-items:center}
#langs{display:flex;gap:4px}
#langs button{width:34px;height:28px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font:700 10px var(--sn);color:#b8b8d2}
#langs button.on{background:var(--mint);color:#0b1a1a;border-color:var(--mint);box-shadow:0 0 12px rgba(46,230,192,.5)}
.rb{width:32px;height:28px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
.rb svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tb{background:var(--yel);border-color:var(--yel)}#tb svg{stroke:#14142a}
#idx{left:944px;top:12px;width:272px;height:54px;border-radius:14px;border:1px solid var(--ln);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:12px;padding:0 14px}
#idx .v{font:700 34px/1 var(--rj);color:var(--mint);text-shadow:0 0 14px rgba(46,230,192,.5)}
#idx .l{font:700 8.4px var(--sn);letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
#idx .b{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden;width:120px}#idx .b i{display:block;height:100%;background:linear-gradient(90deg,#2ee6c0,#f5c342);border-radius:3px}
#me{left:1228px;top:10px;width:242px;height:54px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px}
#me img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--mint);box-shadow:0 0 12px rgba(46,230,192,.45);flex:none}
#me .nm{font:700 13.5px var(--sn);color:#fff}
#me a{font:600 9px var(--sn);color:var(--mint);text-decoration:none;display:block;margin-top:2px;white-space:nowrap}
#flt{left:26px;top:72px;width:1444px;height:28px;display:flex;align-items:center;gap:4px}
.fl{font:800 8px var(--sn);letter-spacing:1.4px;color:var(--mut);text-transform:uppercase;width:34px;flex:none}
.pl{height:24px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font:700 9.6px var(--sn);color:#b8b8d2;text-align:center;line-height:22px;flex:1 1 0;min-width:0;white-space:nowrap}
.pl:hover{background:rgba(255,255,255,.12)}
.pl.on{background:var(--mint);color:#0b1a1a;border-color:var(--mint);box-shadow:0 0 12px rgba(46,230,192,.45)}
.sp{width:16px;flex:none}
[data-m],[data-y]{cursor:pointer}
/* stat cards */
.st .v{font:700 31px/1 var(--rj);color:#fff;letter-spacing:.5px}
.st .v small{font-size:14px;color:var(--mut);font-weight:600;margin-left:3px}
.dl{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:9px;font:700 9px var(--sn);vertical-align:3px}
.dl.up{background:rgba(46,230,192,.15);color:var(--mint)}.dl.dn{background:rgba(255,46,139,.15);color:var(--mag)}.dl.na{background:rgba(255,255,255,.08);color:var(--mut)}
/* table */
.tb{width:100%;border-collapse:collapse;font:600 10.4px var(--sn)}
.tb th{font:700 8px var(--sn);letter-spacing:1.3px;color:var(--mut);text-transform:uppercase;text-align:left;padding:2px 6px 5px}
.tb td{padding:0 6px;height:23.5px;border-top:1px solid rgba(255,255,255,.06);color:#d6d6ea}
.tb td.n{font:700 12px var(--rj);color:#fff;text-align:right}
.mb{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;width:78px}.mb i{display:block;height:100%;border-radius:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.pr{display:flex;align-items:center;gap:8px;height:27px;padding:0 14px;font:600 10.4px var(--sn);color:#d6d6ea}
.pr .nm{width:74px}.pr .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.pr .bar i{display:block;height:100%;background:linear-gradient(90deg,#18b894,#2ee6c0);border-radius:4px}
.pr b{width:42px;text-align:right;font:700 12.5px var(--rj);color:#fff}
/* sheet */
#tbl{position:fixed;inset:0;background:rgba(5,5,15,.7);display:none;place-items:center;z-index:50}
#tbl.on{display:grid}
#sheet{width:min(1040px,96vw);max-height:88vh;background:#fff;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;font:12px var(--sn);color:#222}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#2f6b4f;color:#fff}
#sheet .tp b{font:700 14px var(--sn);flex:1}
#sheet .tp button{background:rgba(255,255,255,.18);color:#fff;font:700 11.5px var(--sn);padding:5px 12px;border-radius:6px}
#sheet .fx{padding:5px 14px;background:#f3f3f3;border-bottom:1px solid #d6d6d6;font:600 11.5px var(--sn);color:#555;display:flex;gap:6px;flex-wrap:wrap}
#sheet .fx span{background:#fff;border:1px solid #d0d0d0;border-radius:4px;padding:1px 8px}
#sheet .sc{overflow:auto;flex:1}
#sheet table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#sheet th,#sheet td{border:1px solid #dcdcdc;padding:3px 9px;white-space:nowrap}
#sheet tr.ab th{background:#e9e9e9;font-weight:600;color:#777;font-size:10.5px;text-align:center;padding:1px}
#sheet tr.hd th{background:#f2f2f2;position:sticky;top:0;cursor:pointer;text-align:left;font-weight:700}
#sheet td.rn{background:#f2f2f2;color:#777;text-align:center;width:36px}
#sheet td.n{text-align:right}
#sheet tbody tr:hover td{background:#eef6f1}
#sheet tfoot td{background:#eaf2ed;font-weight:800;position:sticky;bottom:0}
</style>
</head>

 const rows=[[c.cov,90,0,'%'],[c.exe,90,0,'%'],[c.actp,90,0,'%'],[c.dqa,85,0,''],[c.sat,80,0,'%'],[c.resp,5,1,''],[c.rr,8,1,'']];
 const tab=rows.map((r,i)=>{const a=r[2]?(r[0]?r[1]/r[0]:1):r[0]/r[1],p=Math.min(1,a)*100,col=a>=1?'#2ee6c0':a>=.85?'#f5c342':'#ff2e8b';
  return `<tr><td>${t.names[i]}</td><td class="n">${r[0].toFixed(r[0]<20&&i>4?1:0)}${r[3]}</td><td class="n" style="color:#8b8ba8">${r[2]?'≤':''}${r[1]}${r[3]}</td><td><div class="mb"><i style="width:${p}%;background:${col}"></i></div></td><td><span class="dot" style="background:${col};box-shadow:0 0 8px ${col}" title="${t.st[a>=1?0:a>=.85?1:2]}"></span></td></tr>`}).join('');
 const prov=v.provs.map(p=>`<div class="pr"><span class="nm">${p.n}</span><div class="bar"><i style="width:${Math.min(100,p.cov)}%"></i></div><b>${f0(p.cov)}%</b></div>`).join('');
 $('#main').innerHTML=
  C(36,124,300,230,t.cov,gCov(v),'#2ee6c0',t.tgt+' 90%')
 +C(348,124,376,230,t.exe,gExe(v),'#f5c342')
 +stat(36,t.ben,fm(c.benef),'',dl(c.benef,pv&&pv.benef),v.monthly.map(x=>x.benefA),'gA3','#a77bff')
 +stat(269,t.act,c.done,'/'+c.plan,dl(c.done,pv&&pv.done),v.monthly.map(x=>x.doneA),'gA','#2ee6c0')
 +stat(502,t.cost,(c.bs/1000).toFixed(1),' M MT',dl(c.bs,pv&&pv.bs),v.monthly.map(x=>x.bsA),'gA2','#f2792b')
 +C(36,512,688,302,t.evo,`<div style="position:absolute;right:14px;top:-26px;display:flex;gap:12px;font:700 8.6px var(--sn);color:#b8b8d2"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:linear-gradient(#f7a63a,#6a35d0);margin-right:4px"></i>${t.lgB}</span><span><i style="display:inline-block;width:12px;height:3px;background:#2ee6c0;margin-right:4px;vertical-align:2px"></i>${t.lgC}</span><span><i style="display:inline-block;width:12px;height:3px;background:#f5c342;margin-right:4px;vertical-align:2px"></i>${t.lgE}</span></div><div style="margin:4px 0 0 0">${chart(v)}</div>`,'#a77bff')
 +C(770,124,360,230,t.dqa,gSpeedo(v),'#ff2e8b',t.tgt+' 85')
 +C(1142,124,316,230,t.sat,gSat(v),'#2ee6c0')
 +C(770,366,440,224,t.ind,`<div style="padding:0 10px"><table class="tb"><tr>${t.rcol.map((h,i)=>`<th${i>0&&i<3?' style="text-align:right"':''}>${h}</th>`).join('')}</tr>${tab}</table></div>`,'#f5c342')
 +C(1222,366,236,224,t.risk,gRisk(v),'#ff2e8b')
 +C(770,602,196,212,t.act,gAct(v),'#f5c342')
 +C(978,602,196,212,t.resp,gResp(v),'#f5c342')
 +C(1186,602,272,212,t.prov,`<div style="padding-top:2px">${prov}</div>`,'#2ee6c0');
 $('#idx').innerHTML=`<div class="v">${f0(v.idx)}</div><div><div class="l">${t.idx}</div><div class="b"><i style="width:${v.idx}%"></i></div></div><div style="margin-left:auto;font:700 9px var(--sn);color:${v.idx>=90?'#2ee6c0':v.idx>=75?'#f5c342':'#ff2e8b'}">${t.st[v.idx>=90?0:v.idx>=75?1:2]}</div>`;
 if($('#tbl').classList.contains('on'))sheet();
}
function buildFilters(){
 const t=T[lang];
 $('#flt').innerHTML=`<span class="fl">${t.fy}</span><button class="pl${yr==='all'?' on':''}" data-y="all" style="flex:1.3">${t.all}</button>${YEARS.map(y=>`<button class="pl${yr===y?' on':''}" data-y="${y}">${y}</button>`).join('')}<span class="sp"></span><span class="fl">${t.fm}</span><button class="pl${mon<0?' on':''}" data-m="-1" style="flex:1.3">${t.all}</button>${MON[lang].map((m,i)=>`<button class="pl${mon===i?' on':''}" data-m="${i}">${m}</button>`).join('')}`;
}
function applyLang(){
 const t=T[lang];document.documentElement.lang=lang;
 $$('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);
 $$('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 buildFilters();if(V)render();
}
/* ============ sheet ============ */
function sheetRows(){
 let r=DB.filter(sel).map(m=>({m,v:[m.y,MON[lang][m.m],PROV[m.p].n,m.target,m.benef,m.plan,m.done,m.bp,m.bs,m.dqa,m.sat,m.resp,m.risk]}));
 r.sort((a,b)=>a.m.y-b.m.y||a.m.m-b.m.m||a.m.p-b.m.p);
 if(sortK!==null)r.sort((a,b)=>(a.v[sortK]>b.v[sortK]?1:a.v[sortK]<b.v[sortK]?-1:0)*sortD);
 return r;
}
function sheet(){
 const t=T[lang],rs=sheetRows(),L='ABCDEFGHIJKLM';
 $('#shT').textContent='📊 '+t.tT;$('#shX').textContent=t.tX;$('#shC').textContent=t.tC;
 $('#shF').innerHTML=`<span>${t.tf}:</span><span>${t.fy} ${yr==='all'?t.all:yr}</span><span>${t.fm} ${mon<0?t.all:MON[lang][mon]}</span><span>${rs.length} ${t.tn}</span>`;
 const head=`<tr class="ab"><th></th>${[...L].map(c=>`<th>${c}</th>`).join('')}</tr><tr class="hd"><th></th>${t.cols.map((c,i)=>`<th data-k="${i}">${c}${sortK===i?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`;
 const body=rs.map((x,i)=>`<tr><td class="rn">${i+1}</td>${x.v.map((c,j)=>`<td class="${j>2?'n':''}">${c}</td>`).join('')}</tr>`).join('');
 const S=k=>rs.reduce((a,x)=>a+x.v[k],0),A=k=>rs.length?(S(k)/rs.length).toFixed(1):0;
 const foot=`<tr><td class="rn">Σ</td><td>${t.tot}</td><td>${rs.length}</td><td></td><td class="n">${S(3)}</td><td class="n">${S(4)}</td><td class="n">${S(5)}</td><td class="n">${S(6)}</td><td class="n">${S(7)}</td><td class="n">${S(8)}</td><td class="n">${A(9)}</td><td class="n">${A(10)}</td><td class="n">${A(11)}</td><td class="n">${S(12)}</td></tr>`;
 $('#shTab').innerHTML=`<thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot>`;
}
function exportCsv(){
 const t=T[lang],rs=sheetRows(),q=v=>`"${String(v).replace(/"/g,'""')}"`;
 const csv='﻿'+[t.cols.map(q).join(';'),...rs.map(x=>x.v.map(q).join(';'))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='velocity-kpi.csv';a.click();
}
/* ============ events ============ */
document.addEventListener('click',e=>{
 const y=e.target.closest('[data-y]'),m=e.target.closest('[data-m]'),l=e.target.closest('#langs [data-l]');
 if(y){yr=y.dataset.y==='all'?'all':+y.dataset.y;buildFilters();render()}
 else if(m){const k=+m.dataset.m;mon=(mon===k&&!m.classList.contains('pl'))?-1:k;buildFilters();render()}
 else if(l){lang=l.dataset.l;applyLang()}
 else if(e.target.closest('#rf')){seed=Math.floor(Math.random()*1e6)+1;buildDB();render()}
 else if(e.target.closest('#tb')){$('#tbl').classList.add('on');sheet()}
 else if(e.target.closest('#shC')||e.target.id==='tbl'){$('#tbl').classList.remove('on')}
 else if(e.target.closest('#shX')){exportCsv()}
 else if(e.target.closest('#shTab th[data-k]')){const k=+e.target.closest('th').dataset.k;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=1}sheet()}
});
addEventListener('keydown',e=>{if(e.key==='F9'){e.preventDefault();seed=Math.floor(Math.random()*1e6)+1;buildDB();render()}if(e.key==='Escape')$('#tbl').classList.remove('on')});
function fit(){const s=Math.min(innerWidth/1494,innerHeight/840);$('#stage').style.transform=`translate(${(innerWidth-1494*s)/2}px,${(innerHeight-840*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
if(IMG.bg){const b=$('#bgimg');b.src=IMG.bg;b.style.display='block'}
buildDB();applyLang();render();
</script>
</body>
</html>
